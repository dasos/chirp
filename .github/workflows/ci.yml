name: CI

# Builds the app and runs the test suites on every push/PR. This doubles as an
# automated compile-check since the Gradle wrapper JAR is not committed: each job
# installs a pinned Gradle (via setup-gradle) and invokes `gradle` directly, so no
# wrapper JAR is required.

on:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core unit tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Run :core unit tests
        run: gradle :core:test --no-daemon --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-report
          path: core/build/reports/tests/
          if-no-files-found: ignore

  android-build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # Installs the Android command-line tools and accepts SDK licenses.
      - uses: android-actions/setup-android@v4
      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Verify version matches release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APP_VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "${{ github.ref_name }}" != "v$APP_VERSION" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match versionName $APP_VERSION"
            exit 1
          fi
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: chirp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
