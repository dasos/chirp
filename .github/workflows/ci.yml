name: CI

# Builds the app and runs the test suites on every push/PR. This doubles as an
# automated compile-check since the Gradle wrapper JAR is not committed: each job
# installs a pinned Gradle (via setup-gradle) and invokes `gradle` directly, so no
# wrapper JAR is required.

on:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core unit tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Run :core unit tests
        run: gradle :core:test --no-daemon --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-report
          path: core/build/reports/tests/
          if-no-files-found: ignore

  android-build:
    name: Assemble APK (release on tags, debug on PRs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # Installs the Android command-line tools and accepts SDK licenses.
      # Keep the package list explicit: the action's legacy default includes
      # the removed `tools` package, which makes sdkmanager fail.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Verify version matches release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APP_VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "${{ github.ref_name }}" != "v$APP_VERSION" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match versionName $APP_VERSION"
            exit 1
          fi
      # Pull requests only need a compile check, and the unminified debug build
      # is much faster than running R8 over both modules.
      - name: Assemble debug APKs
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: gradle :app:assembleDebug :wear:assembleDebug --no-daemon --stacktrace

      # Tags produce the artifacts people actually install: minified, resource-
      # shrunk and signed. This is also the only job that exercises R8, so a
      # missing keep rule fails here rather than at runtime on a device.
      - name: Assemble release APKs
        if: startsWith(github.ref, 'refs/tags/')
        run: gradle :app:assembleRelease :wear:assembleRelease --no-daemon --stacktrace

      - name: Name the APKs after their version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APP_VERSION=$(grep -oP 'versionName = "\K[^" ]+' app/build.gradle.kts)
          WEAR_VERSION=$(grep -oP 'versionName = "\K[^" ]+' wear/build.gradle.kts)
          cp app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/chirp-v${APP_VERSION}.apk"
          cp wear/build/outputs/apk/release/*.apk "wear/build/outputs/apk/release/chirp-wear-v${WEAR_VERSION}.apk"

      # R8 and the resource shrinker must never strip what the speech pipeline
      # needs. A missing model or native library would pass every other check
      # here and then fail silently on-device the first time someone speaks.
      - name: Verify the release APK is complete and signed
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/chirp-v*.apk)
          echo "Inspecting $APK"

          unzip -l "$APK" | grep -q 'assets/silero_vad.onnx' \
            || { echo "::error::Silero VAD model missing from the APK — speech-to-text would fail on device"; exit 1; }

          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libonnxruntime.so' \
            || { echo "::error::ONNX Runtime native library missing from the APK"; exit 1; }

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" \
            || { echo "::error::Release APK is not correctly signed"; exit 1; }

          echo "APK size: $(du -h "$APK" | cut -f1)"

      - name: Upload release phone APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: chirp-release-apk
          path: app/build/outputs/apk/release/chirp-v*.apk
          if-no-files-found: error
      - name: Upload release wear APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: chirp-wear-release-apk
          path: wear/build/outputs/apk/release/chirp-wear-v*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/release/chirp-v*.apk
            wear/build/outputs/apk/release/chirp-wear-v*.apk
          generate_release_notes: true
